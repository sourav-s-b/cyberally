name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check tracked Python syntax without importing dependencies
        run: python scripts/check_source.py
